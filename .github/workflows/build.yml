name: Deploy CF Page

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          repository: tcp2/tano8
          token: ${{ secrets.GH_TOKEN }}
          path: source

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('source/bun.lock') }}

      - name: Install dependencies
        working-directory: source
        run: bun install --frozen-lockfile

      - name: Build Astro
        working-directory: source
        run: bun run build
        env:
          NODE_ENV: production
          NOTION_API_SECRET: ${{ secrets.NOTION_API_SECRET }}
          DATABASE_ID: https://app.notion.com/p/65099a4927b74c3ca9c1a95dc993018a

      - name: Count files
        run: |
          echo "Files in dist:"
          find source/dist -type f | wc -l
          echo "Total size:"
          du -sh source/dist

      - name: Deploy to Cloudflare Pages
        run: bunx wrangler pages deploy source/dist --project-name=tano8 --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}