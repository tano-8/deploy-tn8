name: Deploy CF Page

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v6
        with:
          repository: tcp2/tano8
          token: ${{ secrets.GH_TOKEN }}
          path: source

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Build source
        working-directory: source
        run: npm run build
        env:
          NODE_ENV: production
          NOTION_API_SECRET: ${{ secrets.NOTION_API_SECRET }}
          DATABASE_ID: https://app.notion.com/p/65099a4927b74c3ca9c1a95dc993018a

      - name: Verify build output
        run: |
          echo "Files in dist:"
          find source/dist -type f | wc -l
          echo "Total size:"
          du -sh source/dist

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy source/dist --project-name=tano8 --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}