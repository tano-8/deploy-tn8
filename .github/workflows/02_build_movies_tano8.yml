name: Deploy movies

on:
  push:
    branches: [main]
    paths:
      - "domains/tano8-movies/**"
  workflow_dispatch:

concurrency:
  group: deploy-tano8-movies
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          repository: tcp2/tano8
          token: ${{ secrets.GH_TOKEN }}
          path: source

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Get current week
        id: date
        run: echo "week=$(date +'%Y-%U')" >> $GITHUB_OUTPUT

      - name: Cache Media (Rotating Key)
        uses: actions/cache@v6
        with:
          path: source/apps/movies/public/media
          key: ${{ runner.os }}-media-movies-${{ steps.date.outputs.week }}
          restore-keys: |
            ${{ runner.os }}-media-movies-

      - name: Cache Astro & Vite
        uses: actions/cache@v6
        with:
          path: |
            source/node_modules/.cache
            source/apps/movies/.astro
          key: ${{ runner.os }}-astro-movies-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-astro-movies-

      - name: Build
        working-directory: source
        run: pnpm build:movies
        env:
          NODE_ENV: production
          NOTION_API_SECRET: ${{ secrets.NOTION_API_SECRET }}
          DATABASE_ID: bdc98c385c284001a97b938302ef52ba

      - name: Report
        run: |
          echo "Files in dist:"
          find source/apps/movies/dist -type f | wc -l
          echo "Total size:"
          du -sh source/apps/movies/dist

      - name: Deploy
        run: pnpm dlx wrangler pages deploy source/apps/movies/dist --project-name=tano8-movies --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}